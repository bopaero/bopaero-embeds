<!-- Collapsible wrapper. OPEN by default: collapsed, most visitors never reached
       the numbers, and the calculator is the strongest engagement tool on the page. -->                                                                                                     
  <details class="bop-embed calc-accordion" data-calc-root open>                                                                                                        
    <summary class="calc-summary">                                                                                                                       
      <span class="summary-title"></span>                                                                  
      <span class="summary-hint">Open</span>                                                                                                             
      <span class="summary-caret" aria-hidden="true"></span>
    </summary>                                                                                                                                           
                                                            
    <div class="calculator-container">                                                                                                                   
      <h2></h2>       
                                                                                                                                                         
      <!-- Two-column layout for desktop/tablet; stacks on mobile -->                                                                                    
      <div class="calculator-grid">                                                                                                                      
        <!-- LEFT: Image column (on mobile this appears above the calculator) -->                                                                        
        <div class="image-panel">                                                                                                                        
          <img
            data-img="0"                                                                                                                          
            src="https://images.squarespace-cdn.com/content/66bd0ff9d4abd8302892103f/52dda135-bca3-4b6b-ad19-6a3b94b81807/DSC00966_croatia-a2a_013.jpeg?content-type=image%2Fjpeg"                                                                                                                              
            alt=""                                                                                                                        
            loading="lazy"                                                                                                                               
          />                                                
          <img                                                                                                                                           
            data-img="1"                           
            src="https://images.squarespace-cdn.com/content/66bd0ff9d4abd8302892103f/4aad4998-5f44-4e12-8170-7356bfd777d3/FL+Keys+Vision+Jet+Lifestyle.jpeg?content-type=image%2Fjpeg"                                                                                                                          
            alt=""
            loading="lazy"                                                                                                                               
            class="second-image-desktop"                    
          />                                                                                                                                             
        </div>
                                                                                                                                                         
        <!-- RIGHT: Calculator -->                          
        <div class="calculator">

          <!-- Inputs -->                                                                                                                                
          <div class="input-section">
            <label for="ownership-years">                                                                                                                
              Years of Ownership:                           
              <input
                type="number"                                                                                                                            
                id="ownership-years"
                name="ownership-years"                                                                                                                   
                inputmode="numeric"                         
                placeholder="e.g., 5 yrs."
                min="1"                                                                                                                                  
                max="20"
                step="1"                                                                                                                                 
                required                                    
              />
            </label>
            <label for="share-count" style="margin-top:12px;">
              Number of Shares:
              <select id="share-count" name="share-count"></select>
            </label>
            <label for="hours-per-year" style="margin-top:12px;">
              Estimated Flying Hours per Year:
              <input
                type="number"
                id="hours-per-year"
                name="hours-per-year"
                inputmode="decimal"
                placeholder=""
                min="1"
                step="any"
                required
              />
            </label>
            <p class="input-note" id="input-note" hidden></p>                                                                                                                                     
          </div>                                            

          <div class="button-section">
            <button type="button" id="clear-calculator">Clear</button>
            <button type="button" id="calculate-cost">Calculate</button>                                                                                             
          </div>
                                                                                                                                                         
          <div class="output-section">                      
            <h3 id="share-position"></h3>

            <div class="output-item shares-available" data-shares hidden>
              <span>Shares Available:</span>
              <span id="shares-available">-</span>
            </div>
            <div class="output-item share-usage" data-usage="unlimited">
              <span>Usage:</span>
              <span id="share-usage">-</span>
            </div>
<div class="output-item share-hours" data-usage="capped" hidden>
              <span>Usage:</span>
              <span id="share-hours">-</span>
            </div>
            <div class="output-item scheduling-limit" data-usage="unlimited">
              <span>Scheduling Limit:</span>
              <span id="scheduling-limit">-</span>
            </div>
            <div class="output-item">
              <span>Program Cost:*</span>
              <span id="program-cost">-</span>
            </div>
            <div class="output-item">
              <span>Annual Program Fee:**</span>
              <span id="annual-program-fee">-</span>
            </div>
            <div class="output-item">
              <span>Average Fuel/Oil Cost per Hour:***</span>
              <span id="fuel-cost">-</span>
            </div>

            <!-- Blended (ownership-only) -->
            <div class="output-item" id="blended-row">
              <span>Estimated Ownership Cost per Hour:****</span>
              <span id="blended-cost-per-hour">-</span>
            </div>
                                                                                                                                                         
            <div class="usage-warning" id="usage-warning" hidden></div>

            <!-- MOBILE: second image appears below the results -->                                                                                      
            <div class="second-image-mobile">
              <img data-img="1"                                                                                                                                       
                src="https://images.squarespace-cdn.com/content/66bd0ff9d4abd8302892103f/4aad4998-5f44-4e12-8170-7356bfd777d3/FL+Keys+Vision+Jet+Lifestyle.jpeg?content-type=image%2Fjpeg"                                                                                                                      
                alt=""
                loading="lazy"                                                                                                                           
              />                                            
            </div>                                                                                                                                       
                                                            
            <div class="addendum"></div>
          </div>
        </div>
      </div>
    </div>
  </details>
