<!doctype html><html><head><meta charset="utf-8"><title>aircraft-calc testbed</title>
<style>body{font:14px system-ui;margin:20px;background:#f6f6f6}h2{margin:24px 0 6px}
.wrap{background:#fff;padding:14px;border:1px solid #ddd;border-radius:6px}
#log{background:#111;color:#0f0;padding:8px;font:12px monospace;white-space:pre-wrap;min-height:40px}</style>
</head><body>
<h1>aircraft-calc — one engine, two aircraft</h1><div id="log">console:</div>
<h2>SF50 (usage: unlimited)</h2><div class="wrap"><div data-aircraft="sf50"></div></div>
<h2>SR22T (usage: capped)</h2><div class="wrap"><div data-aircraft="sr22t"></div></div>
<h2>Unknown id (must error cleanly, not crash)</h2><div class="wrap"><div data-aircraft="nope"></div></div>
<script>(function(){var l=document.getElementById('log');
['log','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){
 l.textContent+='\n['+k+'] '+[].slice.call(arguments).map(String).join(' ');o.apply(console,arguments);};});
window.addEventListener('error',function(e){l.textContent+='\n[uncaught] '+e.message;});})();</script>
<script src="/docs/aircraft-calc.js" defer></script>
</body></html>
