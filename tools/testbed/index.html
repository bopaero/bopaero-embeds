<!doctype html><html><head><meta charset="utf-8"><title>bop Aero embed testbed</title>
<style>body{font:14px system-ui;margin:24px;background:#f6f6f6}
h2{margin:28px 0 8px}.wrap{background:#fff;padding:16px;border:1px solid #ddd;border-radius:6px}
#log{background:#111;color:#0f0;padding:10px;font:12px monospace;white-space:pre-wrap;min-height:60px}</style>
</head><body>
<h1>Embed testbed</h1><div id="log">console:</div>
<h2>sf50-calc</h2><div class="wrap"><div id="sf50-calc-mount"></div></div>
<h2>sr22t-calc</h2><div class="wrap"><div id="sr22t-calc-mount"></div></div>
<script>
(function(){var l=document.getElementById('log');
['log','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){
 l.textContent+='\n['+k+'] '+Array.prototype.slice.call(arguments).map(String).join(' ');o.apply(console,arguments);};});
window.addEventListener('error',function(e){l.textContent+='\n[uncaught] '+e.message;});})();
</script>
<script src="/dist/sf50-calc.js" defer></script>
<script src="/dist/sr22t-calc.js" defer></script>
</body></html>
