<!doctype html><html><head><meta charset="utf-8"><title>embeds testbed</title>
<style>body{font:14px system-ui;margin:20px;background:#f6f6f6}h2{margin:22px 0 6px}
.wrap{background:#fff;padding:14px;border:1px solid #ddd;border-radius:6px}
/* The flight map draws WHITE borders by design — it lives on the bop Aero navy
   section background on the real site. A white testbed hides the whole map. */
.wrap.dark{background:#003666}
#log{background:#111;color:#0f0;padding:8px;font:12px monospace;white-space:pre-wrap;min-height:36px}
[id^="us-flight-map"]{height:460px}
</style>
</head><body>
<h1>bop Aero embeds — testbed</h1><div id="log">console:</div>
<h2>flight-map · SF50 (split, no circles, dashed divider)</h2>
<div class="wrap dark"><div data-embed="flight-map" data-aircraft="sf50"></div></div>
<h2>flight-map · SR22T (207mi radius circles)</h2>
<div class="wrap dark"><div data-embed="flight-map" data-aircraft="sr22t"></div></div>
<h2>aircraft-calc · SF50</h2>
<div class="wrap"><div data-embed="aircraft-calc" data-aircraft="sf50"></div></div>
<h2>aircraft-calc · SR22T</h2>
<div class="wrap"><div data-embed="aircraft-calc" data-aircraft="sr22t"></div></div>
<script>(function(){var l=document.getElementById('log');
['log','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){
 l.textContent+='\n['+k+'] '+[].slice.call(arguments).map(String).join(' ');o.apply(console,arguments);};});
window.addEventListener('error',function(e){l.textContent+='\n[uncaught] '+e.message;});})();</script>
<script src="/docs/flight-map.js" defer></script>
<script src="/docs/aircraft-calc.js" defer></script>
</body></html>
