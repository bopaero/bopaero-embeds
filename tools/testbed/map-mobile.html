<!doctype html><meta charset="utf-8"><title>flight-map mobile</title>
<!-- Phone-width harness for the maps. The map draws WHITE borders by design, so the
     wrapper must be navy or the map looks broken (it is not). -->
<style>body{margin:0;font:13px system-ui;background:#eee}
h3{margin:8px 12px 4px}.wrap{background:#003666;padding:8px;margin:0 12px 16px}</style>
<h3>SF50 @ 390px</h3>
<div class="wrap"><div data-embed="flight-map" data-aircraft="sf50"></div></div>
<h3>SR22T @ 390px</h3>
<div class="wrap"><div data-embed="flight-map" data-aircraft="sr22t"></div></div>
<script>document.write('<scr'+'ipt src="/docs/flight-map.js?nc='+Date.now()+'" defer></scr'+'ipt>');</script>
