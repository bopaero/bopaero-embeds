name: press watch

# Looks for press that mentions bop Aero and opens an issue for Raymond to review.
# Nothing is published here - see press-publish.yml for what the `publish` label does.
on:
  workflow_dispatch:

concurrency:
  group: press-watch
  cancel-in-progress: false    # unlike health, a skipped run means a missed mention

permissions:
  contents: write              # to commit data/press-seen.json
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic only - no issues, nothing on main
        run: python3 tools/press_diag.py
      - name: Save the report to this branch
        run: |
          git config user.name  "press-watch"
          git config user.email "raymond@bopaero.com"
          git add press-diag-report.json
          git commit -m "diag: press coverage report"
          git push
